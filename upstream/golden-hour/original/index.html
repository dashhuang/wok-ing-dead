<title>GOLDEN HOUR — Solstice Hotel</title>
<style>
  /* 1rem = 10 design px at 1080p. Everything scales with the window; nothing is authored in px. */
  :root { --or: #ff8a2a; --or2: #ffb35c; --fr: #6fdcff; --en: #ff5a36; --good: #7fe08f; --bad: #ff6a4d; --ink: rgba(10, 8, 7, .66); --line: rgba(255, 255, 255, .14);
    --ts: 0 0 .15rem #000, 0 0 .5rem rgba(0, 0, 0, .8), 0 .1rem 1rem rgba(0, 0, 0, .45); --ds: drop-shadow(0 .1rem .15rem rgba(0, 0, 0, .85)); --cut: polygon(0 0, calc(100% - 1rem) 0, 100% 1rem, 100% 100%, 1rem 100%, 0 calc(100% - 1rem));
    --ease: cubic-bezier(.2, .8, .2, 1); --back: cubic-bezier(.3, 1.5, .5, 1);
    /* type scale: small sizes never drop below ~11 px (1280x720), large ones stay proportional */
    --f0: max(11px, 1.1rem); --f1: max(11.5px, 1.25rem); --f2: max(12px, 1.4rem); --f3: max(13px, 1.6rem); --f4: max(14.5px, 1.9rem); }
  @property --p { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
  html { font-size: clamp(6.2px, min(100vh / 108, 100vw / 150), 30px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050403; overflow: hidden; color: #fff; user-select: none; -webkit-user-select: none; }
  body { font-family: Bahnschrift, 'DIN Alternate', 'Barlow Condensed', 'Roboto Condensed', 'Segoe UI', system-ui, sans-serif; font-stretch: 78%; letter-spacing: .04em; font-size: var(--f2); text-transform: uppercase; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  b, strong { font-weight: 700; } em, i { font-style: normal; }
  svg.ic { width: 1em; height: 1em; display: inline-block; vertical-align: middle; flex: none; }
  button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
  .key, kbd { font-family: inherit; display: inline-flex; align-items: center; justify-content: center; min-width: 2.1em; height: 1.75em; padding: 0 .5em; font-size: var(--f1); font-weight: 600; letter-spacing: .06em; line-height: 1;
    color: #fff; background: linear-gradient(#2a2622, #15120f); border: 1px solid rgba(255, 255, 255, .42); border-bottom-width: .2rem; border-radius: .3rem; text-shadow: none; vertical-align: middle; }
  kbd svg.ic { font-size: 1.25em; }
  .t0 { color: var(--fr); } .t1 { color: var(--en); }

  /* ================================ IN-MATCH HUD ================================ */
  #hud { text-shadow: var(--ts); transition: opacity .25s; }
  #world { position: absolute; inset: 0; }
  #safe { position: absolute; top: 0; bottom: 0; left: max(0px, calc((100vw - 220vh) / 2)); right: max(0px, calc((100vw - 220vh) / 2)); }
  #hud.is-clean #safe > :not(#banner) { opacity: 0 !important; transition: opacity .4s; }
  #hud.is-board #events, #hud.is-board #cue, #hud.is-board #cross, #hud.is-board #death, #hud.is-board #hint, #hud.is-dead #events { opacity: 0 !important; }
  #events, #cue { transition: opacity .18s; }
  #weapon > *, #vitals { transition: opacity .3s; } #hud.is-dead #weapon > :not(#fu), #hud.is-dead #vitals { opacity: .3; }
  #hud.is-k9 #hint { opacity: 0 !important; }

  /* --- crosshair --- */
  #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity .07s linear; --xc: #fff; --tw: max(2px, .2rem); --tl: 1rem; }
  #cross.foe { --xc: #ff4a2e; }
  #cross i { position: absolute; background: var(--xc); box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); will-change: transform; }
  #cross .t { width: var(--tw); height: var(--tl); left: calc(var(--tw) / -2); bottom: 0; } #cross .b { width: var(--tw); height: var(--tl); left: calc(var(--tw) / -2); top: 0; }
  #cross .l { height: var(--tw); width: var(--tl); top: calc(var(--tw) / -2); right: 0; } #cross .r { height: var(--tw); width: var(--tl); top: calc(var(--tw) / -2); left: 0; }
  #cross u { position: absolute; width: var(--tw); height: var(--tw); left: calc(var(--tw) / -2); top: calc(var(--tw) / -2); background: var(--xc); box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); }
  #cross svg { position: absolute; left: -50px; top: -50px; width: 100px; height: 100px; overflow: visible; display: none; will-change: transform; }
  #cross svg circle { fill: none; stroke: var(--xc); stroke-width: max(2px, .2rem); vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 1px rgba(0, 0, 0, .9)); }
  #cross.x-smg { --tl: .8rem; } #cross.x-pistol { --tl: .7rem; }
  #cross.x-shotgun { --tl: .6rem; } #cross.x-shotgun svg { display: block; } #cross.x-shotgun u { display: none; }
  /* --- hit markers: three fixed variants, played with the Web Animations API --- */
  .hm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; will-change: transform, opacity; }
  .hm i { position: absolute; left: calc(var(--w) / -2); top: calc(var(--l) / -2); width: var(--w); height: var(--l); background: var(--c); box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 0 .6rem var(--g); border-radius: 1px; }
  .hm i:nth-child(1) { transform: rotate(45deg) translateY(calc(var(--r) * -1)); } .hm i:nth-child(2) { transform: rotate(-45deg) translateY(calc(var(--r) * -1)); }
  .hm i:nth-child(3) { transform: rotate(135deg) translateY(calc(var(--r) * -1)); } .hm i:nth-child(4) { transform: rotate(-135deg) translateY(calc(var(--r) * -1)); }
  #hm-body { --c: #fff; --g: transparent; --w: max(2px, .22rem); --l: 1.2rem; --r: 1.5rem; }

  /* --- damage direction --- */

  /* --- ammo cue under the crosshair --- */

  #cue.busy { color: rgba(255, 255, 255, .85); letter-spacing: .3em; font-size: var(--f1); background: rgba(10, 8, 7, .5); }

  /* --- score strip --- */

  /* --- kill feed --- */

  #hbar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - .2rem), rgba(8, 6, 5, .9) calc(10% - .2rem), rgba(8, 6, 5, .9) 10%); }

  /* --- score events + medals --- */

  #banner { position: absolute; left: 50%; top: 11.6rem; transform: translateX(-50%); display: flex; align-items: center; gap: 1.8rem; opacity: 0; white-space: nowrap; color: #fff; }
  #banner::before { content: ''; position: absolute; inset: -1.6rem -6rem -1.8rem; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(8, 6, 5, .6), rgba(8, 6, 5, .3) 55%, rgba(8, 6, 5, 0) 100%); z-index: -1; }

  #banner span { display: block; font-size: var(--f1); letter-spacing: .34em; margin: .3rem -.34em 0 0; font-weight: 600; text-shadow: 0 0 .2rem #000, 0 0 .5rem #000; }
  #banner i { display: block; width: 10rem; height: .2rem; background: linear-gradient(90deg, transparent, currentColor); transform-origin: right; } #banner i:last-child { background: linear-gradient(270deg, transparent, currentColor); transform-origin: left; }
  #banner b svg.ic { font-size: 1.15em; margin: -.2em .5em 0 0; filter: drop-shadow(0 0 .3rem rgba(0, 0, 0, .9)); }
  #banner.k9 { color: var(--fr); --k9v: var(--fr); } #banner.k9lost { color: var(--or2); --k9v: rgba(255, 255, 255, .35); } #banner.k9lost.red { color: #ff7153; }

  /* --- name tags / grenade / hints / toast --- */

  #nade span { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-size: var(--f1); font-weight: 700; color: #fff; letter-spacing: .06em; text-shadow: var(--ts); margin-top: .1rem; }
