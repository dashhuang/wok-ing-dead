name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Syntax and formatting
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Arsenal build
        if: hashFiles('arsenal/vite.config.js') != ''
        run: npx vite build --config arsenal/vite.config.js

  e2e:
    name: Smoke test (real clicks)
    # The game needs ~10 GB of browser memory to build the street; GitHub-hosted runners
    # for private repos have 7 GB. This job runs on Dash's Mac Studio (self-hosted runner).
    runs-on: [self-hosted, macOS, saltline-e2e]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Title → deploy → pause → die → retry
        run: npm run test:e2e
      - name: Weapon lab (every form fires; clicks, keys, reloads, phone taps)
        if: ${{ !cancelled() && hashFiles('arsenal/playwright.config.js') != '' }}
        run: npm run arsenal:test
      - name: Upload report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            arsenal/test-results/
          retention-days: 14
