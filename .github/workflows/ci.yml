name: CI

# Always runs: syntax, formatting and the production build (~20 s on GitHub's machines).
# The browser smoke test is opt-in and lives in smoke.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Syntax and formatting
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Arsenal build
        if: hashFiles('arsenal/vite.config.js') != ''
        run: npx vite build --config arsenal/vite.config.js
