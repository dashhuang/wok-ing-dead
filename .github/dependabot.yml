version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Add-ons from three/examples run against the Three.js r180 embedded in src/game.js;
      # a newer `three` package can break them without any build error.
      - dependency-name: three
